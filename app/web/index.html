<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="kp-token" content="__KP_TOKEN__">
<meta name="color-scheme" content="light dark">
<title>Конвейер контента</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/web/core.css">
</head>
<body>
<a class="skip" href="#main">К содержимому</a>
<header class="top">
  <div class="brand"><span class="logo" aria-hidden="true">К</span><span>Конвейер контента</span></div>
  <div class="top-right">
    <span id="job-indicator" class="chip" hidden></span>
    <a id="tester-chip" class="chip" href="#settings">Тестировщик не выбран</a>
  </div>
</header>
<div class="layout">
  <nav class="side" aria-label="Разделы"><ul id="nav"></ul></nav>
  <main id="main" tabindex="-1"><p class="muted">Загрузка…</p></main>
</div>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
<dialog id="confirm" class="dlg">
  <form method="dialog">
    <h2 id="confirm-title">Подтвердите</h2>
    <div id="confirm-body"></div>
    <div class="row end">
      <button value="cancel" class="btn">Отмена</button>
      <button value="ok" class="btn primary" id="confirm-ok">Продолжить</button>
    </div>
  </form>
</dialog>
<script src="/web/core.js"></script>
</body>
</html>
